            textarea.value = text;
            textarea.style.position = "fixed"; 
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.select();
            try { document.execCommand("copy"); } catch (err) { console.error(err); }
            document.body.removeChild(textarea);

        // --- Real-time Flight Logic (Restored) ---
        const flights = [

        const FlightWidget = ({ flight }) => {
            const [status, setStatus] = useState("準時");
            const [color, setColor] = useState("text-emerald-600 bg-emerald-50");
            const [timeLeft, setTimeLeft] = useState("");

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const depTime = new Date(flight.dep);
                    const arrTime = new Date(flight.arr);
                    const diffMs = depTime - now;

                    if (now > arrTime) {
                        setStatus("已抵達");
                        setColor("text-stone-500 bg-stone-100");
                        setTimeLeft("旅程結束");
                    } else if (now > depTime) {
                        setStatus("飛行中");
                        setColor("text-blue-600 bg-blue-50");
                        setTimeLeft("航行中");
                    } else if (diffMs < 30 * 60 * 1000 && diffMs > 0) {
                        setStatus("登機中");
                        setColor("text-rose-600 bg-rose-50 animate-pulse");
                        setTimeLeft(`起飛前 ${Math.floor(diffMs / 60000)} 分`);
                    } else {
                        setStatus("準時");
                        setColor("text-emerald-600 bg-emerald-50");
                        const hours = Math.floor(diffMs / (1000 * 60 * 60));
                        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                        if (hours > 24) setTimeLeft(`${Math.floor(hours/24)}天後起飛`);
                        else setTimeLeft(`${hours}時${minutes}分後起飛`);
                    }
                }, 1000);
                return () => clearInterval(timer);

            "12/22": { temp: "21°C", icon: <Sun size={20} />, desc: "晴朗", color: "bg-gradient-to-br from-orange-400 to-amber-200 text-white" },

        // --- Components ---
        const ViewActivityModal = ({ activity, onClose }) => {
            const [copied, setCopied] = useState(false);
            if (!activity) return null;
            const handleCopy = (text) => { copyToClipboard(text); setCopied(true); setTimeout(() => setCopied(false), 2000); };
            const getIcon = (type) => {

                    <div className="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl relative z-10 animate-scale-in max-h-[90vh] flex flex-col">
                        <div className="bg-stone-100 p-4 border-b border-stone-200 flex justify-between items-center"><h3 className="font-bold text-stone-800">{activity ? '編輯行程' : '新增行程'}</h3><button onClick={onClose}><X size={20} className="text-stone-500" /></button></div>
                        <form onSubmit={handleSubmit} className="p-4 overflow-y-auto space-y-4">
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">類型</label><IconSelector value={formData.type} onChange={(val) => setFormData({...formData, type: val})} /></div>
                            <div className="grid grid-cols-3 gap-3"><div className="col-span-1"><label className="block text-xs font-bold text-stone-500 mb-1">時間</label><input type="time" required value={formData.time} onChange={(e) => setFormData({...formData, time: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" /></div><div className="col-span-2"><label className="block text-xs font-bold text-stone-500 mb-1">名稱</label><input type="text" required value={formData.title} onChange={(e) => setFormData({...formData, title: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" placeholder="景點名稱" /></div></div>
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">地址</label><input type="text" value={formData.address} onChange={(e) => setFormData({...formData, address: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" placeholder="Google Maps 地址" /></div>
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">MapCode</label><input type="text" value={formData.mapcode || ''} onChange={(e) => setFormData({...formData, mapcode: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm font-mono" placeholder="33 123 456*78" /></div>
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">標籤</label><input type="text" value={tagInput} onChange={(e) => setTagInput(e.target.value)} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" placeholder="必吃, 拍照" /></div>
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">筆記</label><textarea rows="2" value={formData.desc} onChange={(e) => setFormData({...formData, desc: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" /></div>
                            <div><label className="block text-xs font-bold text-stone-500 mb-1">提示 (黃底)</label><input type="text" value={formData.tips || ''} onChange={(e) => setFormData({...formData, tips: e.target.value})} className="w-full bg-stone-50 border border-stone-200 rounded-lg p-2 text-sm" /></div>
                            <div className="pt-4 flex gap-3">{activity && (<button type="button" onClick={() => onDelete(dayId, activity.id)} className="flex-1 bg-red-50 text-red-600 py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2"><Trash2 size={16} /> 刪除</button>)}<button type="submit" className="flex-[2] bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm flex items-center justify-center gap-2 shadow-lg shadow-indigo-200"><Save size={16} /> 儲存</button></div>
                        </form>
                    </div>
                </div>
            );
        };

        // --- Main App Logic ---
        const App = () => {
            const [activeTab, setActiveTab] = useState('schedule');
            const [itinerary, setItinerary] = useState([]);
            const [poolHistory, setPoolHistory] = useState([]);
            const [personalHistory, setPersonalHistory] = useState([]);
            const [isEditMode, setIsEditMode] = useState(false);
            const [viewActivity, setViewActivity] = useState(null);
            const [editActivity, setEditActivity] = useState(null);
            const [isOnline, setIsOnline] = useState(true);

            // Sync with Firebase
            useEffect(() => {
                if (!isFirebaseReady) {
                    console.warn("No Firebase Config found. Using LocalStorage.");
                    const saved = localStorage.getItem('okinawa_itinerary_offline');
                    if (saved) setItinerary(JSON.parse(saved));
                    else setItinerary(defaultItinerary);
                    return;
                }

                const unsub = onSnapshot(doc(db, "trips", TRIP_DOC_ID), (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        setItinerary(data.itinerary || defaultItinerary);
                        setPoolHistory(data.poolHistory || []);
                        setPersonalHistory(data.personalHistory || []);
                        setIsOnline(true);
                    } else {
                        setDoc(doc(db, "trips", TRIP_DOC_ID), {
                            itinerary: defaultItinerary,
                            poolHistory: [],
                            personalHistory: []
                        });
                        setItinerary(defaultItinerary);
                    }
                }, (error) => {
                    console.error("Firebase Sync Error:", error);
                    setIsOnline(false);
                });

                return () => unsub();
            }, []);

            const updateCloud = async (newItinerary, newPool, newPersonal) => {
                if (isFirebaseReady) {
                    try {
                        await setDoc(doc(db, "trips", TRIP_DOC_ID), {
                            itinerary: newItinerary !== undefined ? newItinerary : itinerary,
                            poolHistory: newPool !== undefined ? newPool : poolHistory,
                            personalHistory: newPersonal !== undefined ? newPersonal : personalHistory
                        }, { merge: true });
                    } catch (e) {
                        console.error("Save failed", e);
                        alert("儲存失敗，請檢查網路或權限");
                    }
                } else {
                    if (newItinerary) {
                        setItinerary(newItinerary);
                        localStorage.setItem('okinawa_itinerary_offline', JSON.stringify(newItinerary));
                    }
                }
            };

            const handleReset = () => {
                if (window.confirm('重置將恢復預設行程並清空所有修改。確定？')) {
                    updateCloud(defaultItinerary); 
                    setIsEditMode(false);
                }
            };

            const handleSaveActivity = (dayId, activityData) => {
                const newItinerary = itinerary.map(day => {
                    if (day.id !== dayId) return day;
                    let newActivities;
                    const existingIndex = day.activities.findIndex(a => a.id === activityData.id);
                    if (existingIndex >= 0) {
                        newActivities = [...day.activities];
                        newActivities[existingIndex] = activityData;
                    } else {
                        newActivities = [...day.activities, activityData];
                    }
                    newActivities.sort((a, b) => a.time.localeCompare(b.time));
                    return { ...day, activities: newActivities };
                });
                updateCloud(newItinerary);
                setEditActivity(null);
            };

            const handleDeleteActivity = (dayId, activityId) => {
                if (!window.confirm('確定刪除？')) return;
                const newItinerary = itinerary.map(day => {
                    if (day.id !== dayId) return day;
                    return { ...day, activities: day.activities.filter(a => a.id !== activityId) };
                });
                updateCloud(newItinerary);
                setEditActivity(null);
            };

            const scrollToDay = (dayId) => {
                setActiveTab('schedule');
                setTimeout(() => { const el = document.getElementById(dayId); if(el) el.scrollIntoView({ behavior: 'smooth' }); }, 100);
            };

            return (
                <div className="min-h-screen font-sans text-stone-800 selection:bg-indigo-100 max-w-md mx-auto bg-stone-50 relative shadow-2xl border-x border-stone-200">
                    {/* Header */}
                    <header className="fixed top-0 w-full bg-white/95 backdrop-blur-md z-20 border-b border-stone-200 shadow-sm max-w-md mx-auto left-0 right-0 px-5 py-3 flex justify-between items-center">
                        <div>
                            <h1 className="text-lg font-black text-stone-800 tracking-wider">OKINAWA '25</h1>
                            <p className="text-[10px] text-stone-500 font-bold tracking-[0.2em] uppercase flex items-center gap-1">
                                Winter Trip 
                                {isFirebaseReady ? (isOnline ? <span className="text-emerald-500 flex items-center"><Cloud size={10} className="mr-0.5"/>雲端同步</span> : <span className="text-red-400 flex items-center"><WifiOff size={10} className="mr-0.5"/>離線</span>) : <span className="text-stone-400 flex items-center"><User size={10} className="mr-0.5"/>單機</span>}
                            </p>
                        </div>
                        <div className="flex gap-2">
                            {isEditMode && (<button onClick={handleReset} className="text-xs bg-red-50 text-red-500 px-2 py-1 rounded font-bold flex items-center gap-1 border border-red-100"><RotateCcw size={12} /> 重置</button>)}
                            <button onClick={() => setIsEditMode(!isEditMode)} className={`text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1 transition-colors ${isEditMode ? 'bg-indigo-600 text-white shadow-md' : 'bg-stone-100 text-stone-600'}`}>{isEditMode ? <CheckCircle2 size={12} /> : <Edit3 size={12} />}{isEditMode ? '完成' : '編輯'}</button>
                        </div>
                    </header>

                    {!isFirebaseReady && (
                        <div className="fixed top-16 left-0 right-0 z-50 px-4">
                            <div className="bg-amber-100 text-amber-800 text-xs p-2 rounded text-center border border-amber-200 shadow-sm">
                                ⚠️ 尚未設定 Firebase Config，目前僅為單機版 (資料不共用)。
                            </div>
                        </div>
                    )}

                    {/* Day Nav */}
                    {activeTab === 'schedule' && (
                        <div className="fixed top-[60px] w-full max-w-md z-10 bg-white/95 backdrop-blur border-b border-stone-200 px-2 py-2 flex justify-between gap-2 overflow-x-auto no-scrollbar">
                            {itinerary.map((day) => (
                                <button key={day.id} onClick={() => scrollToDay(day.id)} className="flex-1 min-w-[70px] bg-stone-50 hover:bg-stone-100 active:bg-indigo-50 border border-stone-100 rounded-lg py-1.5 flex flex-col items-center"><span className="text-[10px] text-stone-400 font-bold uppercase">{day.day}</span><span className="text-xs font-black text-stone-700">{day.date}</span></button>
                            ))}
                        </div>
                    )}

                    <main className={`${activeTab === 'schedule' ? 'pt-36' : 'pt-24'} px-4 pb-24`}>
                        {activeTab === 'schedule' && (
                            <div className="animate-fade-in">
                                {itinerary.map((day) => {
                                    const weather = weatherData[day.date] || weatherData["12/19"];
                                    return (
                                        <div key={day.id} id={day.id} className="scroll-mt-[130px] mb-12">
                                            <div className={`rounded-2xl p-4 mb-4 ${weather.color} shadow-sm relative overflow-hidden`}>
                                                <div className="relative z-10 flex justify-between items-end">
                                                    <div><span className="text-white/80 font-bold text-xs uppercase tracking-widest flex items-center gap-1 mb-1">{day.day} <ArrowRight size={10} /> {day.location}</span><h2 className="text-3xl font-black tracking-tight">{day.date}</h2></div>
                                                    <div className="flex flex-col items-end"><div className="bg-white/20 backdrop-blur-md p-2 rounded-lg flex items-center gap-2">{weather.icon}<span className="font-bold">{weather.temp}</span></div></div>
                                                </div>
                                                <div className="absolute -right-4 -bottom-4 opacity-10 rotate-12">{weather.icon}</div>
                                            </div>
                                            <div className="px-1 space-y-4">
                                                {day.activities.map((act) => {
                                                    const getIcon = (type) => { switch(type) { case 'food': return <Utensils size={18} />; case 'shopping': return <ShoppingBag size={18} />; case 'transport': return <Car size={18} />; case 'hotel': return <BedDouble size={18} />; case 'cafe': return <Coffee size={18} />; default: return <MapPin size={18} />; }};
                                                    return (
                                                        <div key={act.id} onClick={() => isEditMode ? setEditActivity({ dayId: day.id, activity: act }) : setViewActivity(act)} className={`relative group flex gap-4 pl-4 border-l-2 border-dashed border-stone-200 active:scale-[0.98] transition-transform cursor-pointer`}>
                                                            <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-white border-4 border-stone-300 z-0"></div>
                                                            <div className={`flex-1 bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-stone-100 hover:shadow-md transition-all ${isEditMode ? 'border-indigo-300 bg-indigo-50/10' : ''}`}>
                                                                <div className="flex justify-between items-start mb-2"><div className="flex items-center text-stone-400 text-[10px] font-bold tracking-widest bg-stone-50 px-2 py-1 rounded uppercase">{act.time}</div>{isEditMode ? <Edit3 size={14} className="text-indigo-400" /> : (act.mapcode && <div className="text-[9px] font-mono text-stone-300 bg-stone-50 px-1 rounded">MC</div>)}</div>
                                                                <h3 className="font-bold text-stone-800 text-base leading-tight mb-1 flex items-center gap-2">{isEditMode ? null : getIcon(act.type)}{act.title}</h3>
                                                                {!isEditMode && (<div className="flex flex-wrap gap-1 mt-2">{act.tags && act.tags.slice(0, 3).map((tag, idx) => (<span key={idx} className="text-[10px] px-1.5 py-0.5 rounded bg-stone-50 text-stone-400">#{tag}</span>))}</div>)}
                                                            </div>
                                                        </div>
                                                    );
                                                })}
                                                {isEditMode && (<button onClick={() => setEditActivity({ dayId: day.id, activity: null })} className="w-full py-3 border-2 border-dashed border-stone-300 rounded-xl text-stone-400 text-sm font-bold flex items-center justify-center gap-2 hover:bg-stone-50 hover:border-stone-400 transition-colors"><Plus size={16} /> 新增行程</button>)}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {activeTab === 'info' && (
                            <div className="space-y-6 animate-fade-in">
                                <WeatherWidget />
                                <div className="grid grid-cols-2 gap-3 mb-4">
                                    <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-100 flex flex-col justify-center">
                                        <p className="text-stone-400 text-xs font-bold uppercase mb-1">Exchange Rate</p>
                                        <div className="flex items-end gap-1"><span className="text-3xl font-black text-stone-800">0.22</span><span className="text-xs text-stone-500 font-medium mb-1.5">TWD/JPY</span></div>
                                        <p className="text-[10px] text-stone-400 mt-1">*僅供參考</p>
                                    </div>
                                    <div className="bg-stone-800 p-4 rounded-xl shadow-sm flex flex-col justify-center items-center text-white">
                                        <Clock size={24} className="mb-2 text-stone-400" />
                                        <span className="text-xs font-bold">沖繩時間</span>
                                        <span className="text-2xl font-black">{new Date().toLocaleTimeString('en-US', {timeZone: 'Asia/Tokyo', hour: '2-digit', minute:'2-digit', hour12: false})}</span>
                                    </div>
                                </div>

                                <div>
                                    <h3 className="font-bold text-stone-400 text-xs uppercase tracking-widest mb-3 ml-1">Live Flights</h3>
                                    {flights.map(f => <FlightWidget key={f.code} flight={f} />)}
                                </div>

                                <TrafficCard />

                                <div className="bg-red-50 p-5 rounded-2xl border border-red-100"><h3 className="font-bold text-red-800 mb-3 flex items-center gap-2 text-sm uppercase"><Phone size={16} /> Emergency</h3><div className="grid grid-cols-2 gap-2"><div className="bg-white/60 p-2 rounded"><span className="text-[10px] text-red-400 font-bold block">警察</span>110</div><div className="bg-white/60 p-2 rounded"><span className="text-[10px] text-red-400 font-bold block">救護</span>119</div><div className="bg-white/60 p-2 rounded"><span className="text-[10px] text-red-400 font-bold block">租車</span>098-858-0678</div><div className="bg-white/60 p-2 rounded"><span className="text-[10px] text-red-400 font-bold block">外交部</span>080-1009-2436</div></div></div>
                            </div>
                        )}

                        {activeTab === 'budget' && (
                            <BudgetTracker 
                                poolHistory={poolHistory} 
                                personalHistory={personalHistory} 
                                onUpdate={updateCloud} 
                            />
                        )}
                    </main>

                    {/* Modals */}
                    <ViewActivityModal activity={viewActivity} onClose={() => setViewActivity(null)} />
                    {editActivity && (<EditActivityModal dayId={editActivity.dayId} activity={editActivity.activity} onClose={() => setEditActivity(null)} onSave={handleSaveActivity} onDelete={handleDeleteActivity} />)}

                    <nav className="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur border-t border-stone-200 flex justify-around pb-safe z-40" style={{left: '50%', transform: 'translateX(-50%)'}}>
                        <button onClick={() => setActiveTab('schedule')} className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'schedule' ? 'text-indigo-600' : 'text-stone-400'}`}><Calendar size={22} /><span className="text-[9px] mt-1 font-bold">行程</span></button>
                        <button onClick={() => setActiveTab('info')} className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'info' ? 'text-indigo-600' : 'text-stone-400'}`}><Info size={22} /><span className="text-[9px] mt-1 font-bold">情報</span></button>
                        <button onClick={() => setActiveTab('budget')} className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'budget' ? 'text-indigo-600' : 'text-stone-400'}`}><Wallet size={22} /><span className="text-[9px] mt-1 font-bold">記帳</span></button>
                    </nav>
                </div>
            );
        };

        // --- Budget Component (Pass Props for Cloud Sync) ---
        const BudgetTracker = ({ poolHistory, personalHistory, onUpdate }) => {
            const [activeTab, setActiveTab] = useState('pool'); 
            const [splitAmount, setSplitAmount] = useState('');
            const [desc, setDesc] = useState('');
            const [amount, setAmount] = useState('');

            const handleTransaction = (type) => {
                if (!desc || !amount) return;
                const newItem = { id: Date.now(), desc, amount: parseFloat(amount), type, time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', hour12: false}), date: new Date().toLocaleDateString() };
                
                if (activeTab === 'pool') {
                    onUpdate(undefined, [newItem, ...poolHistory], undefined);
                } else {
                    onUpdate(undefined, undefined, [newItem, ...personalHistory]);
                }
                setDesc(''); setAmount('');
            };

            const deleteItem = (id, isPool) => {
                if (isPool) {
                    onUpdate(undefined, poolHistory.filter(i => i.id !== id), undefined);
                } else {
                    onUpdate(undefined, undefined, personalHistory.filter(i => i.id !== id));
                }
            };

            const poolBalance = poolHistory.reduce((acc, item) => item.type === 'deposit' ? acc + item.amount : acc - item.amount, 0);
            const personalTotal = personalHistory.reduce((acc, item) => acc + item.amount, 0);

            return (
                <div className="animate-fade-in">
                    <div className="flex bg-stone-100 p-1 rounded-xl mb-6">
                        {['pool', 'personal', 'split'].map(tab => (<button key={tab} onClick={() => setActiveTab(tab)} className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === tab ? 'bg-white shadow-sm text-stone-800' : 'text-stone-400'}`}>{tab === 'pool' ? '公費' : tab === 'personal' ? '個人' : '分帳'}</button>))}
                    </div>
                    {activeTab === 'split' ? (
                        <div className="bg-white p-8 rounded-2xl border border-stone-100 text-center"><Calculator size={48} className="mx-auto text-indigo-500 mb-4" /><h3 className="text-lg font-bold text-stone-800 mb-6">分帳計算機 (3人)</h3><input type="number" placeholder="總金額" className="w-full text-center text-3xl font-black text-stone-800 border-b-2 border-stone-200 outline-none py-2 mb-6" value={splitAmount} onChange={e => setSplitAmount(e.target.value)} />{splitAmount && <div className="bg-stone-50 p-4 rounded-xl"><p className="text-xs text-stone-400 uppercase font-bold mb-1">每人應付</p><p className="text-4xl font-black text-indigo-600">¥ {Math.ceil(splitAmount / 3).toLocaleString()}</p></div>}</div>
                    ) : (
                        <>
                            <div className={`${activeTab === 'pool' ? 'bg-indigo-600' : 'bg-stone-800'} text-white p-6 rounded-2xl shadow-lg mb-6 relative overflow-hidden transition-colors duration-300`}><div className="relative z-10"><p className="text-white/60 text-xs font-bold uppercase mb-1">{activeTab === 'pool' ? 'Public Fund Balance' : 'My Total Spending'}</p><h2 className="text-4xl font-bold">¥ {(activeTab === 'pool' ? poolBalance : personalTotal).toLocaleString()}</h2></div>{activeTab === 'pool' ? <Users size={100} className="absolute -right-4 -bottom-4 opacity-20" /> : <Wallet size={100} className="absolute -right-4 -bottom-4 opacity-20" />}</div>
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-100 mb-4"><div className="flex gap-2 mb-3"><input value={desc} onChange={e => setDesc(e.target.value)} placeholder="項目" className="w-2/3 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" /><input value={amount} type="number" onChange={e => setAmount(e.target.value)} placeholder="¥" className="w-1/3 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" /></div><div className="flex gap-2">{activeTab === 'pool' ? (<><button onClick={() => handleTransaction('deposit')} className="flex-1 bg-emerald-50 text-emerald-600 py-2 rounded-lg text-xs font-bold hover:bg-emerald-100 border border-emerald-100">+ 入金</button><button onClick={() => handleTransaction('expense')} className="flex-1 bg-rose-50 text-rose-600 py-2 rounded-lg text-xs font-bold hover:bg-rose-100 border border-rose-100">- 支出</button></>) : (<button onClick={() => handleTransaction('expense')} className="flex-1 bg-stone-800 text-white py-2 rounded-lg text-xs font-bold hover:bg-stone-700">新增消費</button>)}</div></div>
                            <div className="space-y-2">{(activeTab === 'pool' ? poolHistory : personalHistory).map(item => (<div key={item.id} className="flex justify-between items-center bg-white p-3 rounded-lg border border-stone-100"><div className="flex items-center gap-3"><span className="text-xs font-mono text-stone-400 bg-stone-50 px-1 rounded">{item.time}</span><div><p className="text-stone-800 text-sm font-bold">{item.desc}</p><p className="text-[10px] text-stone-400">{item.date}</p></div></div><div className="flex items-center gap-3"><span className={`font-mono font-bold ${item.type === 'deposit' ? 'text-emerald-600' : 'text-stone-800'}`}>{item.type === 'deposit' ? '+' : '-'} {item.amount.toLocaleString()}</span><button onClick={() => deleteItem(item.id, activeTab === 'pool')} className="text-stone-300 hover:text-red-400"><Trash2 size={14} /></button></div></div>))}</div>
                        </>
                    )}
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
