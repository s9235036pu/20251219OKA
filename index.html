            document.body.appendChild(textarea);
            textarea.select();

            const [status, setStatus] = useState("準時");
            const [color, setColor] = useState("text-emerald-600 bg-emerald-50");
            const [timeLeft, setTimeLeft] = useState("");

            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    const depTime = new Date(flight.dep);
                    const arrTime = new Date(flight.arr);
                    const diffMs = depTime - now;

                    if (now > arrTime) {
                        setStatus("已抵達");
                        setColor("text-stone-500 bg-stone-100");
                        setTimeLeft("旅程結束");
                    } else if (now > depTime) {
                        setStatus("飛行中");
                        setColor("text-blue-600 bg-blue-50");
                        setTimeLeft("航行中");
                    } else if (diffMs < 30 * 60 * 1000 && diffMs > 0) {
                        setStatus("登機中");
                        setColor("text-rose-600 bg-rose-50 animate-pulse");
                        setTimeLeft(`起飛前 ${Math.floor(diffMs / 60000)} 分`);
                    } else {
                        setStatus("準時");
                        setColor("text-emerald-600 bg-emerald-50");
                        const hours = Math.floor(diffMs / (1000 * 60 * 60));
                        const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                        if (hours > 24) {
                            setTimeLeft(`${Math.floor(hours/24)}天後起飛`);
                        } else {
                            setTimeLeft(`${hours}時${minutes}分後起飛`);
                        }
                    }
                }, 1000);
                return () => clearInterval(timer);
            }, [flight]);

                        tips: "最後免稅店衝刺。",
                        desc: "預計 08:55 抵達桃園機場。回家休息準備隔天上班。",
                        tags: ["回程"]
                    }
                ]
            }
        ];

        // --- Components ---
        const Header = () => (
            <header className="fixed top-0 w-full bg-white/95 backdrop-blur-md z-20 border-b border-stone-200 shadow-sm max-w-md mx-auto left-0 right-0">
                <div className="px-5 py-3 flex justify-between items-center">
                    <div>
                        <h1 className="text-lg font-black text-stone-800 tracking-wider">OKINAWA '25</h1>
                        <p className="text-[10px] text-stone-500 font-bold tracking-[0.2em] uppercase">Winter Trip</p>
                    </div>
                </div>
            </header>
        );

        const DayNavigator = ({ onScrollTo }) => (
            <div className="fixed top-[60px] w-full max-w-md z-10 bg-white/95 backdrop-blur border-b border-stone-200 px-2 py-2 flex justify-between gap-2 overflow-x-auto no-scrollbar">
                {itineraryData.map((day, idx) => (
                    <button 
                        key={idx}
                        onClick={() => onScrollTo(day.id)}
                        className="flex-1 min-w-[70px] bg-stone-50 hover:bg-stone-100 active:bg-indigo-50 active:text-indigo-600 border border-stone-100 rounded-lg py-1.5 flex flex-col items-center transition-colors"
                    >
                        <span className="text-[10px] text-stone-400 font-bold uppercase">{day.day}</span>
                        <span className="text-xs font-black text-stone-700">{day.date}</span>
                    </button>
                ))}
            </div>
        );

        const ActivityModal = ({ activity, onClose }) => {
            const [copied, setCopied] = useState(false);

            if (!activity) return null;

            const handleCopy = () => {
                copyToClipboard(activity.address);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            const handleCopyMapCode = () => {
                if (activity.mapcode) {
                    copyToClipboard(activity.mapcode);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                }
            };

            const isFood = activity.icon.type === Utensils || activity.icon.type === Coffee;

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center px-4 animate-fade-in">
                    <div className="absolute inset-0 bg-stone-900/40 backdrop-blur-sm" onClick={onClose} />
                    <div className="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl relative z-10 animate-scale-in flex flex-col max-h-[85vh]">
                        <div className="h-28 bg-stone-50 relative overflow-hidden shrink-0">
                            <div className="absolute inset-0 opacity-10 bg-[radial-gradient(#444cf7_1px,transparent_1px)] [background-size:16px_16px]"></div>
                            <div className="absolute inset-0 flex items-center justify-center">
                                <div className="bg-white p-4 rounded-full shadow-lg text-indigo-600">
                                    {activity.icon}
                                </div>
                            </div>
                            <button onClick={onClose} className="absolute top-3 right-3 bg-white/80 p-2 rounded-full text-stone-500 hover:text-stone-800 transition-colors">
                                <X size={20} />
                            </button>
                        </div>
                        
                        <div className="p-6 overflow-y-auto">
                            <h3 className="text-2xl font-black text-stone-800 mb-1">{activity.title}</h3>
                            <div className="flex flex-col gap-1 text-stone-500 text-xs font-mono mb-4">
                                <div className="flex items-start">
                                    <MapPin size={12} className="mr-1 mt-0.5 shrink-0" /> 
                                    <span className="leading-tight">{activity.address}</span>
                                </div>
                                {activity.mapcode && (
                                    <div className="flex items-center text-indigo-600 font-bold">
                                        <Navigation size={12} className="mr-1 shrink-0" /> 
                                        MAPCODE: {activity.mapcode}
                                    </div>
                                )}
                            </div>

                            <div className="flex gap-2 mb-5 flex-wrap">
                                {activity.tags.map((tag, i) => (
                                    <span key={i} className="px-2 py-1 bg-indigo-50 text-indigo-700 text-xs rounded-md font-bold">
                                        {tag}
                                    </span>
                                ))}
                            </div>
                            
                            <p className="text-stone-600 text-sm leading-relaxed mb-6">
                                {activity.desc}
                            </p>

                            {activity.tips && (
                                <div className="bg-amber-50 border-l-4 border-amber-300 p-3 mb-6 rounded-r-lg">
                                    <p className="text-xs text-amber-800 font-medium flex items-start gap-2">
                                        <Info size={14} className="mt-0.5 shrink-0" />
                                        {activity.tips}
                                    </p>
                                </div>
                            )}
                        </div>

                        <div className="p-4 bg-stone-50 border-t border-stone-200 shrink-0 grid grid-cols-2 gap-3">
                            <button 
                                onClick={() => window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(activity.title + " " + activity.address)}`, '_blank')}
                                className="col-span-2 flex items-center justify-center gap-2 bg-indigo-600 text-white py-3 rounded-xl font-bold text-sm hover:bg-indigo-700 transition-colors shadow-lg shadow-indigo-200"
                            >
                                <Navigation size={16} /> 開啟 Google Maps 導航
                            </button>

                            {activity.mapcode ? (
                                <button 
                                    onClick={handleCopyMapCode}
                                    className={`flex items-center justify-center gap-2 border py-3 rounded-xl font-bold text-sm transition-colors ${copied ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'}`}
                                >
                                    {copied ? <CheckCircle2 size={16} /> : <Copy size={16} />} 
                                    {copied ? "已複製" : "複製 MapCode"}
                                </button>
                            ) : (
                                <button 
                                    onClick={handleCopy}
                                    className={`flex items-center justify-center gap-2 border py-3 rounded-xl font-bold text-sm transition-colors ${copied ? 'bg-emerald-50 border-emerald-200 text-emerald-600' : 'bg-white border-stone-200 text-stone-600 hover:bg-stone-50'}`}
                                >
                                    {copied ? <CheckCircle2 size={16} /> : <Copy size={16} />} 
                                    {copied ? "已複製" : "複製地址"}
                                </button>
                            )}

                            <button 
                                onClick={() => {
                                    const query = isFood ? `tabelog ${activity.title}` : `instagram ${activity.title}`;
                                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                                }}
                                className={`flex items-center justify-center gap-2 bg-white text-stone-600 border border-stone-200 py-3 rounded-xl font-bold text-sm hover:bg-stone-50 transition-colors`}
                            >
                                {isFood ? <Utensils size={16} /> : <Instagram size={16} />}
                                {isFood ? "查看食評" : "IG 探店"}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ActivityCard = ({ activity, onClick }) => {
            return (
                <div 
                    onClick={() => onClick(activity)}
                    className="group flex gap-4 mb-5 relative pl-4 border-l-2 border-dashed border-stone-200 last:mb-2 cursor-pointer active:scale-[0.98] transition-transform"
                >
                    <div className="absolute -left-[9px] top-0 w-4 h-4 rounded-full bg-white border-4 border-stone-300 z-0 shadow-sm group-hover:border-indigo-500 transition-colors"></div>
                    
                    <div className="flex-1 bg-white rounded-xl p-4 shadow-[0_2px_8px_rgba(0,0,0,0.04)] border border-stone-100 hover:shadow-md hover:border-indigo-200 transition-all">
                        <div className="flex justify-between items-start mb-2">
                            <div className="flex items-center text-stone-400 text-[10px] font-bold tracking-widest bg-stone-50 px-2 py-1 rounded uppercase">
                                {activity.time}
                            </div>
                            {activity.mapcode && <div className="text-[9px] font-mono text-stone-300 bg-stone-50 px-1 rounded">MC</div>}
                        </div>
                        
                        <h3 className="font-bold text-stone-800 text-base leading-tight mb-1 flex items-center gap-2">
                            {activity.title}
                        </h3>
                        
                        <div className="flex flex-wrap gap-1 mt-2">
                            {activity.tags.slice(0, 3).map((tag, idx) => {
                                let color = "text-stone-400 bg-stone-50";
                                if(tag.includes("必吃") || tag.includes("預約") || tag.includes("已購票")) color = "text-rose-600 bg-rose-50";
                                if(tag.includes("重要") || tag.includes("駕照") || tag.includes("必逛")) color = "text-amber-600 bg-amber-50 font-bold";
                                
                                return (
                                    <span key={idx} className={`text-[10px] px-1.5 py-0.5 rounded ${color}`}>
                                        #{tag}
                                    </span>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const DayCard = ({ dayData, onActivityClick, id }) => {
            const weather = weatherData[dayData.date];
            
            return (
                <div id={id} className="scroll-mt-[130px] mb-12">
                    <div className={`rounded-2xl p-4 mb-4 ${weather.color} shadow-sm relative overflow-hidden`}>
                        <div className="relative z-10 flex justify-between items-end">
                            <div>
                                <span className="text-white/80 font-bold text-xs uppercase tracking-widest flex items-center gap-1 mb-1">
                                    {dayData.day} <ArrowRight size={10} /> {dayData.location}
                                </span>
                                <h2 className="text-3xl font-black tracking-tight">{dayData.date}</h2>
                            </div>
                            <div className="flex flex-col items-end">
                                <div className="bg-white/20 backdrop-blur-md p-2 rounded-lg flex items-center gap-2">
                                    {weather.icon}
                                    <span className="font-bold">{weather.temp}</span>
                                </div>
                                <span className="text-[10px] mt-1 font-medium text-white/90">{weather.desc}</span>
                            </div>
                        </div>
                        <div className="absolute -right-4 -bottom-4 opacity-10 rotate-12">
                            {weather.icon}
                        </div>
                    </div>
                    
                    <div className="px-1">
                        {dayData.activities.map((act, idx) => (
                            <ActivityCard key={idx} activity={act} onClick={onActivityClick} />
                        ))}
                    </div>
                </div>
            );
        };

        const BudgetTracker = () => {
            const [activeTab, setActiveTab] = useState('pool'); 
            const [poolHistory, setPoolHistory] = useState([]);
            const [personalHistory, setPersonalHistory] = useState([]);
            const [splitAmount, setSplitAmount] = useState('');
            
            const [desc, setDesc] = useState('');
            const [amount, setAmount] = useState('');
            const [category, setCategory] = useState('food');

            useEffect(() => {
                const savedPool = localStorage.getItem('okinawa_pool_v6');
                if (savedPool) setPoolHistory(JSON.parse(savedPool));
                
                const savedPersonal = localStorage.getItem('okinawa_personal_v6');
                if (savedPersonal) setPersonalHistory(JSON.parse(savedPersonal));
            }, []);

            useEffect(() => {
                localStorage.setItem('okinawa_pool_v6', JSON.stringify(poolHistory));
            }, [poolHistory]);

            useEffect(() => {
                localStorage.setItem('okinawa_personal_v6', JSON.stringify(personalHistory));
            }, [personalHistory]);

            const poolBalance = useMemo(() => {
                return poolHistory.reduce((acc, item) => item.type === 'deposit' ? acc + item.amount : acc - item.amount, 0);
            }, [poolHistory]);

            const personalTotal = useMemo(() => {
                return personalHistory.reduce((acc, item) => acc + item.amount, 0);
            }, [personalHistory]);

            const handleTransaction = (type) => {
                if (!desc || !amount) return;
                const now = new Date();
                const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
                const newItem = { 
                    id: Date.now(), 
                    desc, 
                    amount: parseFloat(amount), 
                    type, 
                    time: timeStr,
                    date: now.toLocaleDateString(),
                    category 
                };

                if (activeTab === 'pool') {
                    setPoolHistory([newItem, ...poolHistory]);
                } else {
                    setPersonalHistory([newItem, ...personalHistory]);
                }
                setDesc(''); setAmount('');
            };

            const deleteItem = (id, isPool) => {
                if (isPool) {
                    setPoolHistory(poolHistory.filter(i => i.id !== id));
                } else {
                    setPersonalHistory(personalHistory.filter(i => i.id !== id));
                }
            };

            const renderHistory = (history, isPool) => (
                <div className="space-y-2 mt-4">
                    {history.map(item => (
                        <div key={item.id} className="flex justify-between items-center bg-white p-3 rounded-lg border border-stone-100">
                            <div className="flex items-center gap-3">
                                <span className="text-xs font-mono text-stone-400 bg-stone-50 px-1 rounded">{item.time}</span>
                                <div>
                                    <p className="text-stone-800 text-sm font-bold">{item.desc}</p>
                                    <p className="text-[10px] text-stone-400">{item.date}</p>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <span className={`font-mono font-bold ${item.type === 'deposit' ? 'text-emerald-600' : 'text-stone-800'}`}>
                                    {item.type === 'deposit' ? '+' : '-'} {item.amount.toLocaleString()}
                                </span>
                                <button onClick={() => deleteItem(item.id, isPool)} className="text-stone-300 hover:text-red-400">
                                    <Trash2 size={14} />
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            );

            return (
                <div className="pt-4 pb-24 px-4">
                    <div className="flex bg-stone-100 p-1 rounded-xl mb-6">
                        {['pool', 'personal', 'split'].map(tab => (
                            <button 
                                key={tab}
                                onClick={() => setActiveTab(tab)} 
                                className={`flex-1 py-2 text-xs font-bold rounded-lg transition-all ${activeTab === tab ? 'bg-white shadow-sm text-stone-800' : 'text-stone-400'}`}
                            >
                                {tab === 'pool' ? '公費' : tab === 'personal' ? '個人' : '分帳'}
                            </button>
                        ))}
                    </div>

                    {activeTab === 'split' ? (
                        <div className="animate-fade-in bg-white p-8 rounded-2xl border border-stone-100 text-center">
                            <Calculator size={48} className="mx-auto text-indigo-500 mb-4" />
                            <h3 className="text-lg font-bold text-stone-800 mb-6">分帳計算機 (3人)</h3>
                            <input 
                                type="number" 
                                placeholder="輸入總金額" 
                                className="w-full text-center text-3xl font-black text-stone-800 border-b-2 border-stone-200 focus:border-indigo-500 outline-none py-2 mb-6"
                                value={splitAmount}
                                onChange={e => setSplitAmount(e.target.value)}
                            />
                            {splitAmount && (
                                <div className="bg-stone-50 p-4 rounded-xl">
                                    <p className="text-xs text-stone-400 uppercase font-bold mb-1">每人應付</p>
                                    <p className="text-4xl font-black text-indigo-600">¥ {Math.ceil(splitAmount / 3).toLocaleString()}</p>
                                </div>
                            )}
                        </div>
                    ) : (
                        <>
                            <div className={`${activeTab === 'pool' ? 'bg-indigo-600' : 'bg-stone-800'} text-white p-6 rounded-2xl shadow-lg mb-6 relative overflow-hidden transition-colors duration-300`}>
                                <div className="relative z-10">
                                    <p className="text-white/60 text-xs font-bold uppercase mb-1">{activeTab === 'pool' ? 'Public Fund Balance' : 'My Total Spending'}</p>
                                    <h2 className="text-4xl font-bold">¥ {(activeTab === 'pool' ? poolBalance : personalTotal).toLocaleString()}</h2>
                                </div>
                                {activeTab === 'pool' ? <Users size={100} className="absolute -right-4 -bottom-4 opacity-20" /> : <Wallet size={100} className="absolute -right-4 -bottom-4 opacity-20" />}
                            </div>

                            <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-100">
                                <div className="flex gap-2 mb-3">
                                    <input value={desc} onChange={e => setDesc(e.target.value)} placeholder="項目 (例: 晚餐)" className="w-2/3 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                    <input value={amount} type="number" onChange={e => setAmount(e.target.value)} placeholder="¥ 金額" className="w-1/3 bg-stone-50 border border-stone-200 rounded-lg px-3 py-2 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <div className="flex gap-2">
                                    {activeTab === 'pool' ? (
                                        <>
                                            <button onClick={() => handleTransaction('deposit')} className="flex-1 bg-emerald-50 text-emerald-600 py-2 rounded-lg text-xs font-bold hover:bg-emerald-100 border border-emerald-100">+ 公費入金</button>
                                            <button onClick={() => handleTransaction('expense')} className="flex-1 bg-rose-50 text-rose-600 py-2 rounded-lg text-xs font-bold hover:bg-rose-100 border border-rose-100">- 公費支出</button>
                                        </>
                                    ) : (
                                        <button onClick={() => handleTransaction('expense')} className="flex-1 bg-stone-800 text-white py-2 rounded-lg text-xs font-bold hover:bg-stone-700">新增消費</button>
                                    )}
                                </div>
                            </div>
                            {renderHistory(activeTab === 'pool' ? poolHistory : personalHistory, activeTab === 'pool')}
                        </>
                    )}
                </div>
            );
        };

        const InfoSection = () => (
            <div className="pt-4 pb-24 px-4 space-y-6">
                <div className="grid grid-cols-2 gap-3">
                    <WeatherWidget />
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-stone-100 flex flex-col justify-center">
                        <p className="text-stone-400 text-xs font-bold uppercase mb-1">Exchange Rate</p>
                        <div className="flex items-end gap-1">
                            <span className="text-3xl font-black text-stone-800">0.22</span>
                            <span className="text-xs text-stone-500 font-medium mb-1.5">TWD/JPY</span>
                        </div>
                        <p className="text-[10px] text-stone-400 mt-1">*僅供參考</p>
                    </div>
                </div>

                <div>
                    <h3 className="font-bold text-stone-400 text-xs uppercase tracking-widest mb-3 ml-1">Live Flights</h3>
                    {flights.map(f => <FlightWidget key={f.code} flight={f} />)}
                </div>

                <TrafficCard />

                <div className="bg-red-50 p-5 rounded-2xl border border-red-100">
                    <h3 className="font-bold text-red-800 mb-3 flex items-center gap-2 text-sm uppercase tracking-wider">
                        <Phone size={16} /> Emergency
                    </h3>
                    <div className="grid grid-cols-2 gap-2">
                        <div className="bg-white/60 p-2 rounded border border-red-100"><span className="text-[10px] text-red-400 font-bold block">警察</span>110</div>
                        <div className="bg-white/60 p-2 rounded border border-red-100"><span className="text-[10px] text-red-400 font-bold block">救護</span>119</div>
                        <div className="bg-white/60 p-2 rounded border border-red-100"><span className="text-[10px] text-red-400 font-bold block">租車</span>098-858-0678</div>
                        <div className="bg-white/60 p-2 rounded border border-red-100"><span className="text-[10px] text-red-400 font-bold block">外交部</span>080-1009-2436</div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('schedule');
            const [selectedActivity, setSelectedActivity] = useState(null);

            const scrollToDay = (dayId) => {
                setActiveTab('schedule');
                setTimeout(() => {
                    const element = document.getElementById(dayId);
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth' });
                    }
                }, 100);
            };

            return (
                <div className="min-h-screen font-sans text-stone-800 selection:bg-indigo-100 selection:text-indigo-800 max-w-md mx-auto bg-stone-50 relative shadow-2xl border-x border-stone-200">
                    <Header />
                    
                    {activeTab === 'schedule' && <DayNavigator onScrollTo={scrollToDay} />}

                    <main className={`${activeTab === 'schedule' ? 'pt-36' : 'pt-24'} px-4 pb-24`}>
                        {activeTab === 'schedule' && (
                            <div className="animate-fade-in">
                                {itineraryData.map((day, idx) => (
                                    <DayCard key={idx} id={day.id} dayData={day} onActivityClick={setSelectedActivity} />
                                ))}
                                <div className="text-center opacity-30 text-[10px] py-4">
                                    Designed for Okinawa Winter Trip
                                </div>
                            </div>
                        )}

                        {activeTab === 'info' && <InfoSection />}
                        
                        {activeTab === 'budget' && <BudgetTracker />}
                    </main>

                    {selectedActivity && (
                        <ActivityModal 
                            activity={selectedActivity} 
                            onClose={() => setSelectedActivity(null)} 
                        />
                    )}

                    <nav className="fixed bottom-0 max-w-md w-full bg-white/95 backdrop-blur border-t border-stone-200 flex justify-around pb-safe safe-area-bottom z-40 shadow-[0_-4px_20px_rgba(0,0,0,0.03)]" style={{left: '50%', transform: 'translateX(-50%)'}}>
                        <button 
                            onClick={() => setActiveTab('schedule')}
                            className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'schedule' ? 'text-indigo-600 scale-110' : 'text-stone-300 hover:text-stone-500'}`}
                        >
                            <Calendar size={22} />
                            <span className={`text-[9px] mt-1 font-bold ${activeTab === 'schedule' ? 'opacity-100' : 'opacity-0 scale-0'} transition-all duration-200`}>行程</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('info')}
                            className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'info' ? 'text-indigo-600 scale-110' : 'text-stone-300 hover:text-stone-500'}`}
                        >
                            <Info size={22} />
                            <span className={`text-[9px] mt-1 font-bold ${activeTab === 'info' ? 'opacity-100' : 'opacity-0 scale-0'} transition-all duration-200`}>情報</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('budget')}
                            className={`flex flex-col items-center justify-center w-full py-3 transition-all duration-200 ${activeTab === 'budget' ? 'text-indigo-600 scale-110' : 'text-stone-300 hover:text-stone-500'}`}
                        >
                            <Wallet size={22} className={activeTab === 'budget' ? "fill-indigo-100" : ""} />
                            <span className={`text-[9px] mt-1 font-bold ${activeTab === 'budget' ? 'opacity-100' : 'opacity-0 scale-0'} transition-all duration-200`}>記帳</span>
                        </button>
                    </nav>
                </div>
            );
        };

        // Render
        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
